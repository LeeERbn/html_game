// ---------- 商店 ----------
function renderShop(root) {
  const s = G.shopStock;
  root.innerHTML = topBar() +
    '<div class="screen-center shop-screen">' +
    '<h2 class="section-title">🛒 地精商店</h2>' +
    '<p class="gold-gain">你的金币：🪙 ' + G.gold + (hasRelic('ledger') ? '（账本折扣已生效 -25%）' : '') + '</p>' +
    '<div class="shop-row" id="shop-cards"></div>' +
    '<div class="shop-row" id="shop-extra"></div>' +
    '<div class="shop-services">' +
    '<button class="btn shop-svc" ' + (s.healSold || G.gold < s.healPrice ? 'disabled' : '') + ' onclick="buyHeal()">🍷 满血干杯<br><small>回复 25 生命 · ' + s.healPrice + ' 金币' + (s.healSold ? ' · 已售' : '') + '</small></button>' +
    '<button class="btn shop-svc" ' + (s.removeSold || G.gold < s.removePrice ? 'disabled' : '') + ' onclick="buyRemove()">🔥 焚烧卡牌<br><small>从牌组删除一张 · ' + s.removePrice + ' 金币</small></button>' +
    '</div>' +
    '<button class="btn btn-big" onclick="leaveShop()">离开商店 →</button>' +
    '</div>';
  const cardWrap = $('shop-cards');
  s.cards.forEach((item, i) => {
    const slot = document.createElement('div');
    slot.className = 'shop-item';
    cardWrap.appendChild(slot);
    if (item.sold) { slot.innerHTML = '<div class="sold-tag">已售出</div>'; return; }
    const el = cardEl(item.inst, null, 'clickable');
    el.onclick = () => buyCard(i);
    const price = document.createElement('div');
    price.className = 'price-tag' + (G.gold < item.price ? ' cant' : '');
    price.textContent = '🪙 ' + item.price;
    slot.appendChild(el); slot.appendChild(price);
  });
  const extra = $('shop-extra');
  // 遗物
  const rSlot = document.createElement('div');
  rSlot.className = 'shop-item';
  extra.appendChild(rSlot);
  if (!s.relic) { rSlot.innerHTML = '<div class="sold-tag">—</div>'; }
  else if (s.relic.sold) { rSlot.innerHTML = '<div class="sold-tag">已售出</div>'; }
  else {
    const r = RELICS[s.relic.id];
    rSlot.innerHTML = '<div class="shop-relic" data-tip="' + r.name + '：' + r.desc + '">' + r.icon + '</div>';
    const price = document.createElement('div');
    price.className = 'price-tag' + (G.gold < s.relic.price ? ' cant' : '');
    price.textContent = '🪙 ' + s.relic.price;
    rSlot.appendChild(price);
    rSlot.onclick = () => buyRelic();
    rSlot.style.cursor = 'pointer';
  }
  // 药水
  s.potions.forEach((it, i) => {
    const slot = document.createElement('div');
    slot.className = 'shop-item';
    extra.appendChild(slot);
    const p = POTIONS[it.id];
    if (it.sold) { slot.innerHTML = '<div class="sold-tag">已售出</div>'; return; }
    slot.innerHTML = '<div class="shop-relic" data-tip="' + p.name + '：' + p.desc + '">' + p.icon + '</div>';
    const price = document.createElement('div');
    price.className = 'price-tag' + (G.gold < it.price ? ' cant' : '');
    price.textContent = '🪙 ' + it.price;
    slot.appendChild(price);
    slot.onclick = () => buyShopPotion(i);
    slot.style.cursor = 'pointer';
  });
}

// ---------- 先古遗民 ----------
function chooseSettlerRelic(id) {
  const s = G.settler;
  if (!s || s.phase !== 'choose') return;
  if (id === 'ancient_scroll') { s.phase = 'scroll'; s.sel = []; render(); return; }
  if (id === 'ancient_book') {
    s.relic = id; G.relics.push(id); s.transformed = 0; s.phase = 'book';
    setLog('你收下了先民古书。');
    render();
    showDeck('transform');
    return;
  }
  s.relic = id; G.relics.push(id); s.phase = 'done';
  setLog('获得了遗物【' + RELICS[id].name + '】：' + RELICS[id].desc);
  saveRun(); render();
}
function toggleSettlerGroup(i) {
  const s = G.settler;
  if (!s || s.phase !== 'scroll') return;
  const at = s.sel.indexOf(i);
  if (at >= 0) s.sel.splice(at, 1);
  else if (s.sel.length < 2) s.sel.push(i);
  render();
}
function confirmScroll() {
  const s = G.settler;
  if (!s || s.sel.length !== 2) return;
  s.sel.forEach(gi => scrollGroups()[gi].cards.forEach(cid => G.deck.push({ id: cid, up: false })));
  s.relic = 'ancient_scroll'; G.relics.push('ancient_scroll');
  s.phase = 'done';
  setLog('你抄录了两组卡页，获得了先民卷轴与 6 张卡牌！');
  saveRun(); render();
}
function healSettler() {
  const s = G.settler;
  if (!s || s.healed || G.act !== 2) return;
  const heal = Math.floor(G.maxHp * 0.4);
  G.hp = Math.min(G.maxHp, G.hp + heal);
  s.healed = true;
  setLog('先古遗民的祝福涌入体内，回复了 ' + heal + ' 点生命。');
  render();
}
function chooseSettlerUnique(id) {
  const s = G.settler;
  if (!s || s.relic || G.act !== 2) return;
  s.relic = id; G.relics.push(id);
  setLog('获得了独特遗物【' + RELICS[id].name + '】：' + RELICS[id].desc);
  saveRun(); render();
}
function leaveSettlers() { G.settler = null; advance(); }

function renderSettlers(root) {
  const s = G.settler;
  const isAct2 = G.act === 2;
  let body = '';
  if (!isAct2) {
    // 第一幕：三选一遗物赠礼
    if (s.phase === 'choose') {
      body = '<p class="event-text">他们是塔中最古老的居民。"远行的孩子，带上先民的馈赠吧。"</p>' +
        '<div class="event-options">' +
        SETTLER_ACT1.map(id => {
          const r = RELICS[id];
          const desc = id === 'ancient_scroll' ? '从两组卡牌中各获得 3 张牌'
            : id === 'ancient_book' ? '选择牌组里的两张牌，随机变化成其他牌'
            : '篝火休息时额外回复 15% 最大生命';
          return '<button class="btn event-opt" onclick="chooseSettlerRelic(\'' + id + '\')">' + r.icon + ' <b>' + r.name + '</b><br><small>' + desc + '</small></button>';
        }).join('') + '</div>';
    } else if (s.phase === 'scroll') {
      body = '<p class="event-text">摊开的卷轴上有四组卡页，你最多可以抄录<b>两组</b>（已选 ' + s.sel.length + ' / 2）。</p>' +
        '<div class="scroll-row">' +
        scrollGroups().map((g, gi) => {
          const sel = s.sel.includes(gi);
          return '<div class="scroll-group' + (sel ? ' selected' : '') + '" onclick="toggleSettlerGroup(' + gi + ')">' +
            '<b>' + g.name + '</b>' +
            '<div class="group-cards" id="sg-' + gi + '"></div>' +
            '</div>';
        }).join('') +
        '</div>' +
        '<button class="btn btn-big" ' + (s.sel.length === 2 ? '' : 'disabled') + ' onclick="confirmScroll()">确认抄录 →</button>';
    } else {
      body = '<p class="event-result">遗民们满意地点了点头。</p>' +
        '<button class="btn btn-big" onclick="leaveSettlers()">继续前进 →</button>';
    }
  } else {
    // 第二幕：回复 40% + 独特遗物三选一
    body = '<p class="event-text">第二幕的遗民据点。"你的伤需要处理。另外……这件东西，也许对你有用。"</p>' +
      '<div style="margin-bottom:18px">' +
      '<button class="btn btn-big" ' + (s.healed ? 'disabled' : '') + ' onclick="healSettler()">🧡 接受治疗<br><small>' +
      (s.healed ? '已回复' : '回复 40% 最大生命（' + Math.floor(G.maxHp * 0.4) + ' 点）') + '</small></button>' +
      '</div>' +
      '<div class="event-options">' +
      SETTLER_ACT2.map(id => {
        const r = RELICS[id];
        const taken = s.relic === id;
        const locked = !!s.relic && !taken;
        return '<button class="btn event-opt" ' + (locked ? 'disabled' : '') + ' onclick="chooseSettlerUnique(\'' + id + '\')">' +
          r.icon + ' <b>' + r.name + '</b>' + (taken ? ' ✓' : '') + '<br><small>' + r.desc + '</small></button>';
      }).join('') + '</div>' +
      '<div style="margin-top:26px"><button class="btn btn-big" onclick="leaveSettlers()">继续前进 →</button></div>';
  }
  root.innerHTML = topBar() +
    '<div class="screen-center event-screen">' +
    '<div class="event-art">🗿</div>' +
    '<h2 class="section-title">先古遗民</h2>' +
    body +
    '</div>';
  // 卷轴组内的卡牌
  if (!isAct2 && s.phase === 'scroll') {
    scrollGroups().forEach((g, gi) => {
      const wrap = $('sg-' + gi);
      g.cards.forEach(cid => wrap.appendChild(cardEl({ id: cid, up: false }, null, '')));
    });
  }
}

// ---------- 金卡三选一 ----------
function renderGoldChoice(root) {
  root.innerHTML = topBar() +
    '<div class="screen-center">' +
    '<h2 class="section-title">✨ BOSS 的宝藏</h2>' +
    '<p class="gold-gain">第一幕完成！从宝藏中选择一张<b>金卡</b></p>' +
    '<div class="reward-row" id="gold-row"></div>' +
    '<button class="btn btn-big" onclick="skipGold()">放弃金卡，继续前进 →</button>' +
    '</div>';
  const row = $('gold-row');
  G.pendingReward.forEach((inst, i) => row.appendChild(cardEl(inst, () => chooseGold(i), 'clickable')));
}

// ---------- 幕间过场 ----------
function renderActClear(root) {
  const nextMap = MAPS[G.actOrder[1]];
  root.innerHTML = topBar() +
    '<div class="screen-center actclear-screen">' +
    '<h1 class="game-title win-title">🗝️ 第一幕完成！</h1>' +
    '<p class="subtitle">你击败了' + MAPS[G.actOrder[0]].bossName + '，塔中的阶梯继续向上延伸。</p>' +
    '<p class="event-text">第二幕：<b>' + nextMap.name + '</b> —— 那里的怪物远比下面凶残，但先古遗民仍在高处守望。<br>你的生命、卡牌、遗物与金币都将保留。</p>' +
    '<button class="btn btn-big" onclick="startAct2()">深入尖塔 · 进入第二幕 →</button>' +
    '</div>';
}

// ---------- 结算 ----------
function renderEnd(root, win) {
  const s = G.stats;
  root.innerHTML =
    '<div class="screen-center end-screen">' +
    '<h1 class="game-title ' + (win ? 'win-title' : 'lose-title') + '">' + (win ? '🏆 登顶成功！' : '💀 你倒下了……') + '</h1>' +
    '<p class="subtitle">' + (win ? '你击败了' + MAPS[G.actOrder[1]].bossName + '，尖塔在晨光中崩塌。' : '尖塔再次吞噬了一位挑战者。') + '</p>' +
    '<p class="end-stats">到达层数：第 ' + (G.map.nodes[G.pos].col + 1) + ' 层 · 种子：' + (G.seed || '随机') + '</p>' +
    '<p class="end-stats">战斗 ' + s.fights + ' 场 · 总回合 ' + s.turns + ' · 造成伤害 ' + s.dealt + ' · 承受伤害 ' + s.taken + '</p>' +
    '<p class="end-stats">遗物 ' + G.relics.length + ' 件 · 牌组 ' + G.deck.length + ' 张 · 剩余金币 ' + G.gold + '</p>' +
    '<button class="btn btn-big" onclick="backToTitle()">返回角色选择</button>' +
    '</div>';
}

// ---------- 牌组弹窗 ----------
let deckMode = 'view';
function showDeck(mode) {
  deckMode = mode || 'view';
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'deck-overlay';
  // 注意：不能用对象字面量一次性构造标题——所有分支会被立即求值，
  // remove 分支引用 G.shopStock 会在篝火/地图上因 shopStock 为 null 而抛错
  let title;
  if (deckMode === 'view') title = '📇 你的牌组（' + G.deck.length + ' 张）';
  else if (deckMode === 'upgrade') title = '⚒️ 选择要强化的卡牌';
  else if (deckMode === 'transform') title = '📕 选择要变化的卡牌（还需 ' + Math.max(0, 2 - (G.settler ? G.settler.transformed : 0)) + ' 张）';
  else title = '🔥 选择要删除的卡牌' + (G.freeRemove ? '（事件免费）' : (G.shopStock ? '（' + G.shopStock.removePrice + ' 金币）' : ''));
  overlay.innerHTML =
    '<div class="modal"><h3>' + title + '</h3>' +
    '<div class="deck-grid" id="deck-grid"></div>' +
    '<button class="btn" onclick="closeDeck()">关闭</button></div>';
  document.body.appendChild(overlay);
  const grid = $('deck-grid');
  G.deck.forEach((inst, i) => {
    const slot = document.createElement('div');
    slot.className = 'deck-item';
    let onClick = null;
    if (deckMode === 'upgrade') onClick = cardUpgradable(inst) ? () => doUpgrade(i) : null;
    if (deckMode === 'remove') onClick = () => doRemove(i);
    if (deckMode === 'transform') onClick = () => doTransform(i);
    const cls = onClick ? 'clickable' : (deckMode === 'upgrade' ? 'disabled' : '');
    slot.appendChild(cardEl(inst, onClick, cls));
    grid.appendChild(slot);
  });
}
// 卡牌能否强化：尚未强化过，且至少有一个效果带强化加值（诅咒牌没有 effects）
function cardUpgradable(inst) {
  const def = CARDS[inst.id];
  if (inst.up) return false;
  // 数值型升级：任一效果带 up 加值
  if ((def.effects || []).some(e => e.up)) return true;
  // 费用型升级：upCost 存在且与当前费用不同（如电击 1→0、聚变 2→1）
  return def.upCost != null && def.upCost !== def.cost;
}
function doUpgrade(i) {
  const inst = G.deck[i], def = CARDS[inst.id];
  if (!cardUpgradable(inst)) { alert('这张卡无法强化。'); return; }
  inst.up = true;
  if (deckMode === 'upgrade') G.restUsed = true;
  setLog('【' + def.name + '】被强化为【' + def.name + '+】');
  closeDeck(); render();
}
function doRemove(i) {
  const free = G.freeRemove;
  if (!free) {
    const s = G.shopStock;
    if (!s || s.removeSold || G.gold < s.removePrice) return;
    G.gold -= s.removePrice; s.removeSold = true;
  } else {
    G.freeRemove = false;
  }
  setLog('【' + cardName(G.deck[i]) + '】被焚毁了。');
  G.deck.splice(i, 1);
  closeDeck(); render();
}
// 古书：把一张牌随机变化成其他牌（诅咒与基础牌除外）
function doTransform(i) {
  const inst = G.deck[i];
  if (!inst) return;
  const pool = Object.keys(CARDS).filter(id =>
    (CARDS[id].char || 'knight') === (G.char || 'knight') &&
    CARDS[id].rarity !== 'curse' && CARDS[id].rarity !== 'basic' && id !== inst.id);
  const nid = R('event').pick(pool);
  setLog('【' + cardName(inst) + '】在书页间扭曲，变化成了【' + CARDS[nid].name + '】！');
  G.deck[i] = { id: nid, up: false };
  G.settler.transformed++;
  if (G.settler.transformed >= 2) {
    G.settler.phase = 'done';
    setLog('古书缓缓合上了。');
    closeDeck();
    saveRun(); render();
  } else {
    closeDeck();
    showDeck('transform');
  }
}
function closeDeck() { const o = $('deck-overlay'); if (o) o.remove(); }

// ---------- 拖拽出牌 ----------
let dragState = null;
function attachDrag(el, idx) {
  el.addEventListener('mousedown', ev => {
    ev.preventDefault();
    dragState = { idx, el, sx: ev.clientX, sy: ev.clientY, active: false };
    const move = e => {
      if (!dragState) return;
      const dx = e.clientX - dragState.sx, dy = e.clientY - dragState.sy;
      if (!dragState.active && Math.hypot(dx, dy) < 6) return;
      dragState.active = true;
      el.classList.add('dragging');
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.1)';
      $('app').classList.toggle('over-drop', e.clientY < window.innerHeight * 0.48);
    };
    const up = e => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if (!dragState) return;
      const wasActive = dragState.active;
      const play = wasActive && e.clientY < window.innerHeight * 0.48;
      el.classList.remove('dragging');
      el.style.transform = '';
      $('app').classList.remove('over-drop');
      dragState = null;
      if (play) playCard(idx);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// 初始化
G = newState();
render();

</script>
