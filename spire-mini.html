<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尖塔 · 迷你版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #232336 0%, #15151f 55%, #0c0c12 100%);
    color: #e8e2d4;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 0 12px 12px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  .btn { background: linear-gradient(180deg, #7d4a9e, #5d3480); color: #fff; border: 2px solid #9a6cc0; padding: 10px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
  .btn:disabled { background: #3a3a46; border-color: #55555f; color: #8888a0; cursor: not-allowed; transform: none; filter: none; }
  .btn-big { padding: 14px 44px; font-size: 18px; }
  .btn-small { padding: 5px 14px; font-size: 13px; border-width: 1px; }

  /* ===== 顶栏 ===== */
  .topbar { display: flex; align-items: center; gap: 22px; padding: 10px 18px; background: rgba(0,0,0,.45); border-bottom: 2px solid #3a3a4c; border-radius: 0 0 12px 12px; margin-bottom: 8px; font-weight: bold; }
  .tb-hp { color: #ff6a5e; }
  .tb-gold { color: #f0c04a; }
  .tb-floor { color: #a99ec4; margin-right: auto; }

  /* ===== 标题/结算页 ===== */
  .screen-center { text-align: center; padding: 34px 10px; flex: 1; }
  .title-screen, .end-screen, .rest-screen, .shop-screen { background: rgba(0,0,0,.25); border-radius: 14px; }
  .game-title { font-size: 52px; letter-spacing: 8px; color: #e8c66a; text-shadow: 0 0 24px rgba(232,198,106,.35), 0 3px 0 #5a4416; margin-bottom: 10px; }
  .win-title { color: #ffd54a; }
  .lose-title { color: #b0524a; text-shadow: 0 0 24px rgba(176,82,74,.3), 0 3px 0 #4a1c18; }
  .subtitle { color: #9a90a8; margin-bottom: 24px; }
  .section-title { font-size: 28px; color: #e8c66a; margin-bottom: 14px; }
  .helpbox { background: rgba(20,18,30,.85); border: 1px solid #4a4458; border-radius: 10px; padding: 18px 28px; max-width: 560px; margin: 0 auto 28px; text-align: left; line-height: 2; font-size: 14px; color: #cfc8b8; }
  .helpbox b { color: #e8c66a; }
  .gold-gain { color: #f0c04a; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .end-stats { color: #a99ec4; margin-bottom: 24px; }

  /* ===== 地图页 ===== */
  .map-page { flex: 1; display: flex; flex-direction: column; }
  .map-wrap {
    position: relative; flex: 1; min-height: 62vh;
    background: linear-gradient(160deg, #ece0c4 0%, #e0d0aa 60%, #d3c096 100%);
    border-radius: 10px; border: 3px solid #8a7a5c;
    box-shadow: inset 0 0 60px rgba(120,95,55,.35), 0 6px 24px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-lines line { stroke: #8a7a5c; stroke-width: 2; stroke-dasharray: 5 4; opacity: .75; }
  .map-node {
    position: absolute; transform: translate(-50%, -50%);
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #faf4e2, #e6d8b4);
    border: 2px solid #8a7a5c; font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(90,70,35,.4);
    user-select: none;
  }
  .map-node.done { opacity: .55; filter: grayscale(.7); }
  .map-node.current { border: 3px solid #b03a2e; box-shadow: 0 0 12px rgba(176,58,46,.8); }
  .map-node.reachable {
    border-color: #b03a2e; cursor: pointer;
    animation: pulse 1.2s infinite;
  }
  .map-node.reachable:hover { transform: translate(-50%,-50%) scale(1.15); }
  .map-node.boss-node { width: 60px; height: 60px; font-size: 30px; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 6px rgba(176,58,46,.6); }
    50% { box-shadow: 0 0 18px rgba(255,120,60,.95); }
  }
  .map-legend {
    position: absolute; right: 14px; top: 14px;
    background: #f7f0dd; border: 2px solid #8a7a5c; border-radius: 8px;
    color: #5a4a2c; font-size: 13px; padding: 10px 16px; text-align: left; line-height: 1.8;
    box-shadow: 0 3px 10px rgba(90,70,35,.35);
  }
  .map-hint { text-align: center; color: #9a90a8; font-size: 13px; padding: 10px 0; }

  /* ===== 战斗场景 ===== */
  .battlefield {
    position: relative; flex: 1; min-height: 380px;
    display: flex; align-items: center; justify-content: space-around;
    padding-bottom: 30px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(60,50,80,.5) 0%, transparent 60%),
      linear-gradient(180deg, transparent 62%, rgba(0,0,0,.5) 63%, rgba(0,0,0,.65) 100%);
    border-radius: 14px;
  }
  .battlefield::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 90px),
                repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 2px, transparent 2px 90px);
  }
  .fighter-zone { position: relative; text-align: center; z-index: 2; }
  .fighter { transition: transform .1s; }
  .fighter.shake { animation: shakeX .38s; }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    18% { transform: translateX(-16px); } 36% { transform: translateX(13px); }
    54% { transform: translateX(-9px); } 72% { transform: translateX(6px); } 88% { transform: translateX(-3px); }
  }
  .fighter.lunge { animation: lungeF .4s; }
  #player-fig.lunge { animation-name: lungeR; }
  #enemy-fig.lunge { animation-name: lungeL; }
  @keyframes lungeR { 0%,100% { transform: translateX(0); } 40% { transform: translateX(42px); } }
  @keyframes lungeL { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-42px); } }
  .boss-fig { filter: drop-shadow(0 0 18px rgba(195,74,255,.35)); }

  .fighter-info { width: 240px; margin: 4px auto 0; }
  .enemy-nm { font-weight: bold; color: #d4b8ff; margin-bottom: 3px; font-size: 15px; }
  .tier-tag { font-size: 11px; font-weight: normal; color: #ffb03a; background: rgba(255,176,58,.12); border: 1px solid rgba(255,176,58,.45); border-radius: 8px; padding: 1px 6px; vertical-align: 2px; cursor: help; }
  .fi-row { display: flex; align-items: center; gap: 6px; }
  .shield-zone { display: inline-flex; flex-shrink: 0; }
  .hpbar { position: relative; flex: 1; height: 20px; background: #2a2a34; border: 1px solid #55555f; border-radius: 10px; overflow: hidden; }
  .hpfill { height: 100%; background: linear-gradient(180deg, #e05548, #a32c22); border-radius: 10px; transition: width .25s; }
  .hpbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; }
  .shield-badge {
    position: relative;
    background: linear-gradient(180deg, #3f7fbf, #245a8f); border: 1px solid #7fb8e8;
    border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: bold; color: #fff;
    white-space: nowrap; cursor: help;
  }
  .shield-badge:hover::after {
    content: attr(data-tip); position: absolute; bottom: 135%; left: 50%; transform: translateX(-50%);
    background: #0e0c14; color: #eee; padding: 7px 11px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; border: 1px solid #5a5468; z-index: 90;
  }
  .buff-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 6px; min-height: 22px; }
  .buff {
    position: relative; font-size: 11.5px; padding: 2px 8px; border-radius: 9px;
    color: #fff; cursor: help; white-space: nowrap;
  }
  .buff:hover::after {
    content: attr(data-tip); position: absolute; bottom: 135%; left: 50%; transform: translateX(-50%);
    background: #0e0c14; color: #eee; padding: 7px 11px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; border: 1px solid #5a5468; z-index: 90; box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  .b-str  { background: #8f2c24; border: 1px solid #c96a5c; }
  .b-vuln { background: #9a5410; border: 1px solid #d68a3a; }
  .b-weak { background: #6e6414; border: 1px solid #a89c34; }

  .enemy-intent {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    background: #f7f0dd; color: #8f2c24; font-weight: bold; font-size: 16px;
    border: 2px solid #8a7a5c; border-radius: 18px; padding: 4px 16px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.5); z-index: 3;
  }
  .enemy-intent::after { content: '▾'; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); color: #f7f0dd; font-size: 14px; }

  .dmg-float {
    position: absolute; top: 18%; transform: translate(-50%, 0);
    font-size: 32px; font-weight: bold; color: #ff5a4e;
    text-shadow: 0 0 8px rgba(0,0,0,.8), 0 2px 0 #4a100c;
    animation: floatUp .95s forwards; pointer-events: none; z-index: 60;
  }
  .dmg-float.fx-block { color: #6fb8ff; font-size: 22px; text-shadow: 0 0 8px rgba(0,0,0,.8); }
  .dmg-float.fx-heal { color: #6fe08a; font-size: 24px; }
  .dmg-float.fx-icon { font-size: 42px; animation-duration: 1.15s; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
  }

  .log-line { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); color: #8a8298; font-size: 13px; white-space: nowrap; }

  /* ===== 手牌 ===== */
  .hand {
    display: flex; justify-content: center; align-items: flex-end;
    min-height: 208px; padding: 14px 60px 6px; position: relative;
  }
  .hand-slot { margin: 0 -16px; position: relative; }
  .hand-slot .card { transform: rotate(var(--r, 0deg)) translateY(var(--y, 0px)); transform-origin: bottom center; }

  .card {
    width: 132px; height: 182px; background: linear-gradient(170deg, #fdf8ea, #efe4c8);
    border-radius: 11px; border: 2px solid #b8a880;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    padding: 12px 9px 8px; position: relative; text-align: center;
    transition: transform .15s, box-shadow .15s;
    user-select: none; -webkit-user-drag: none;
  }
  .card.type-attack { border-color: #b03a2e; }
  .card.type-skill  { border-color: #2e6da4; }
  .card.type-power  { border-color: #7d3c98; }
  .card-cost {
    position: absolute; top: -9px; left: -9px; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd54a, #d68910);
    color: #5a3a08; font-weight: bold; display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.5); border: 1px solid #8a5a10;
  }
  .card-name { font-weight: bold; font-size: 14.5px; color: #3a3226; }
  .card-type { font-size: 11px; color: #8a7f68; margin: 3px 0 7px; }
  .card-desc { font-size: 12px; line-height: 1.55; color: #4a4234; }
  .card.playable { cursor: grab; }
  .card.playable:not(.dragging):hover {
    transform: rotate(0deg) translateY(-36px) scale(1.09) !important;
    box-shadow: 0 12px 26px rgba(0,0,0,.6); z-index: 40;
  }
  .card.disabled { opacity: .5; filter: grayscale(.4); }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { transform: translateY(-5px); box-shadow: 0 10px 22px rgba(0,0,0,.5); }
  .card.dragging { transition: none; cursor: grabbing; z-index: 100 !important; opacity: .92; }

  #app.over-drop .battlefield::after {
    content: '松手打出 ⚡'; position: absolute; inset: 12px;
    border: 3px dashed rgba(255, 213, 74, .8); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: bold; color: #ffd54a;
    background: rgba(255, 213, 74, .08); z-index: 50; pointer-events: none;
  }

  .energy-orb {
    position: absolute; left: 22px; bottom: 20px; width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff7a5e, #c0392b 60%, #7a1c12);
    border: 3px solid #e8a598; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: bold;
    box-shadow: 0 0 18px rgba(192,57,43,.6); z-index: 55;
  }
  .energy-orb span { font-size: 22px; line-height: 1; }
  .endturn { position: absolute; right: 22px; bottom: 24px; z-index: 55; font-size: 16px; padding: 10px 26px; }
  .endturn small { font-size: 11px; font-weight: normal; opacity: .85; }
  .piles-info { position: absolute; left: 24px; bottom: 96px; font-size: 12px; color: #8a8298; z-index: 55; }

  /* ===== 奖励/商店 ===== */
  .reward-row, .shop-row { display: flex; gap: 22px; justify-content: center; margin: 22px 0 26px; flex-wrap: wrap; }
  .shop-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .price-tag { background: #2a2634; border: 1px solid #6a5a2c; color: #f0c04a; font-weight: bold; border-radius: 14px; padding: 3px 14px; font-size: 14px; }
  .price-tag.cant { color: #8888a0; border-color: #44444f; }
  .sold-tag { width: 132px; height: 182px; display: flex; align-items: center; justify-content: center; border: 2px dashed #4a4458; border-radius: 11px; color: #6a6478; font-size: 16px; }
  .shop-services { display: flex; gap: 22px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .shop-svc { background: linear-gradient(180deg, #8a5a2b, #6a4420); border-color: #c99a5b; }
  .shop-svc small { font-size: 12px; }
  .rest-row { display: flex; gap: 26px; justify-content: center; margin-top: 22px; }
  .campfire-art { font-size: 84px; line-height: 1.2; filter: drop-shadow(0 0 26px rgba(255,140,40,.7)); animation: flick 1.6s infinite; }
  @keyframes flick { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* ===== 弹窗 ===== */
  .overlay { position: fixed; inset: 0; background: rgba(5,4,10,.7); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal { background: #1c1826; border: 2px solid #4a4458; border-radius: 14px; padding: 26px; max-width: 900px; max-height: 85vh; overflow-y: auto; text-align: center; }
  .modal h3 { margin-bottom: 18px; color: #e8c66a; }
  .deck-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 20px; }
  .deck-item .card { width: 110px; height: 154px; }

  /* ===== v3 新增：遗物 / 药水 / 事件 / 诅咒 / 日志 ===== */
  .relic-bar, .potion-bar { display: inline-flex; gap: 4px; }
  .relic {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; font-size: 16px;
    background: radial-gradient(circle at 35% 30%, #4a4066, #2c2438);
    border: 1px solid #8a7ab0; box-shadow: 0 2px 5px rgba(0,0,0,.4);
  }
  .relic:hover::after {
    content: attr(data-tip); position: absolute; top: 135%; left: 50%; transform: translateX(-50%);
    background: #0e0c14; color: #eee; padding: 7px 11px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; border: 1px solid #5a5468; z-index: 300; box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  .potion-panel { position: absolute; right: 26px; bottom: 100px; display: flex; flex-direction: column; gap: 8px; z-index: 55; }
  .potion-btn {
    position: relative; width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
    background: radial-gradient(circle at 35% 30%, #4a6a9e, #243a5f); border: 2px solid #7fa8d8;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .potion-btn:hover { filter: brightness(1.3); }
  .potion-btn::after {
    content: attr(data-tip); position: absolute; right: 115%; top: 50%; transform: translateY(-50%);
    background: #0e0c14; color: #eee; padding: 7px 11px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; border: 1px solid #5a5468; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 300;
  }
  .potion-btn:hover::after { opacity: 1; }
  .log-panel {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    max-width: 640px; text-align: center; font-size: 12.5px; color: #9a92ac; line-height: 1.5;
    pointer-events: none;
  }
  .log-panel div:last-child { color: #d8d2c0; }
  .card.type-curse { border-color: #6a5a8a; background: linear-gradient(170deg, #ded4ea, #b8a8cc); }
  .card-kw { margin-top: 6px; }
  .kw {
    display: inline-block; font-size: 10.5px; background: #6a5a8a; color: #fff;
    border-radius: 8px; padding: 1px 7px; margin: 1px; position: relative; cursor: help;
  }
  .kw:hover::after {
    content: attr(data-tip); position: absolute; bottom: 140%; left: 50%; transform: translateX(-50%);
    background: #0e0c14; color: #eee; padding: 6px 10px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; border: 1px solid #5a5468; z-index: 300;
  }
  .b-dex    { background: #2e6da4; border: 1px solid #6aa3d8; }
  .b-frail  { background: #7a5a8a; border: 1px solid #b094c8; }
  .b-poison { background: #3e7a2e; border: 1px solid #7ab865; }
  .b-thorns { background: #6e5a14; border: 1px solid #b89c34; }
  .b-arti   { background: #8a6a2a; border: 1px solid #d8a850; }
  .b-focus  { background: #4a3585; border: 1px solid #9f8bff; }
  .b-orbslot{ background: #2c5a72; border: 1px solid #6fc4e8; }

  /* ===== v5 角色选择 ===== */
  .char-row { display: flex; gap: 26px; justify-content: center; margin: 16px 0 10px; flex-wrap: wrap; }
  .char-card { width: 250px; background: #171425; border: 2px solid #3a3450; border-radius: 14px;
               padding: 14px 14px 16px; text-align: center; cursor: pointer; transition: .15s; }
  .char-card:hover { border-color: #8f7bff; transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.55); }
  .char-card h3 { margin: 4px 0 2px; font-size: 19px; color: #f0d9a8; }
  .char-card.defect h3 { color: #9fb4ff; }
  .char-portrait svg { filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .char-title { color: #8d87a8; font-size: 13px; margin-bottom: 8px; }
  .char-desc { color: #b8b2cf; font-size: 13px; line-height: 1.55; min-height: 62px; }
  .char-relic { color: #e0b25c; font-size: 12px; margin: 6px 0 10px; }

  /* ===== v5 充能球栏 ===== */
  .orb-bar { display: flex; gap: 7px; justify-content: center; margin-bottom: 4px; min-height: 36px; }
  .orb { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
         font-size: 15px; position: relative; border: 2px solid rgba(255,255,255,.3);
         animation: orbFloat 2.6s ease-in-out infinite; cursor: default; }
  .orb:nth-child(2n) { animation-delay: .5s; }
  .orb:nth-child(3n) { animation-delay: 1.1s; }
  .orb i { position: absolute; bottom: -8px; right: -6px; font-style: normal; font-size: 11px; font-weight: bold;
           color: #fff; background: #0e0c14; border-radius: 8px; padding: 0 4px; border: 1px solid #5a5468; }
  .orb-empty { background: rgba(255,255,255,.04); border: 2px dashed rgba(255,255,255,.16); animation: none; }
  .o-lightning { background: radial-gradient(circle at 35% 30%, #ffe89a, #c8901a); }
  .o-frost     { background: radial-gradient(circle at 35% 30%, #c8ecff, #3a7fa8); }
  .o-dark      { background: radial-gradient(circle at 35% 30%, #a675e0, #3a1f66); }
  .o-glass     { background: radial-gradient(circle at 35% 30%, #eafff3, #6aa88a); }
  .o-plasma    { background: radial-gradient(circle at 35% 30%, #ffd0a0, #b85a10); }
  @keyframes orbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .dmg-float.fx-orb   { color: #9fdcff; font-size: 24px; }
  .dmg-float.fx-evoke { color: #ffd54a; font-size: 40px; animation-duration: 1.25s; }
  .seed-row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 8px; }
  .seed-input {
    background: #14121c; border: 1px solid #4a4458; color: #e8e2d4; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; width: 220px; font-family: inherit;
  }
  .seed-input::placeholder { color: #6a6478; }
  .event-art { font-size: 72px; line-height: 1.3; filter: drop-shadow(0 0 20px rgba(232,198,106,.5)); }
  .event-text { max-width: 520px; margin: 0 auto 24px; color: #cfc8b8; line-height: 1.9; }

const $ = id => document.getElementById(id);

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// mulberry32 种子随机数生成器（SeededRng）
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  return {
    next,
    int: n => Math.floor(next() * n),
    pick: a => a[Math.floor(next() * a.length)],
    shuffle: a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  };
}

const RNG_DOMAINS = ['map', 'reward', 'shop', 'enemy', 'event', 'potion', 'combat'];
function initRng(seed) {
  const base = hashSeed(String(seed));
  G.rng = {};
  RNG_DOMAINS.forEach((k, i) => { G.rng[k] = makeRng((base + Math.imul(i + 1, 0x9E3779B9)) >>> 0); });

function newState(seed, charId) {

    seed: seed || '',

    gold: 30,

// ---------- 存档 ----------
function saveRun() {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ version: 6, savedAt: Date.now(), run: G }));
  } catch (e) { /* 存档失败不阻塞游戏 */ }
}
function loadRun() {
  try {
    if (typeof localStorage === 'undefined') return false;
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.version !== 6 || !d.run || !d.run.map) return false;
    G = d.run;
    G.screen = 'map';
    return true;
  } catch (e) { return false; }
}
function clearSave() { try { if (typeof localStorage !== 'undefined') localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ==================== 9. 通用规则（无 DOM） ====================
function shufflePile(a) { return R('combat').shuffle(a); }

function calcDmg(atk, def, base) {
  let dmg = base + (atk.str || 0) + (atk.dmgUp || 0);
  if (atk.weak > 0) dmg *= 0.75;
  if (def.vuln > 0) dmg *= 1.5;
  return Math.max(0, Math.floor(dmg));
}

function gainBlock(stats, v) {
  let b = v + (stats.dex || 0);
  if (stats.frail > 0) b = Math.floor(b * 0.75);
  return Math.max(0, b);
}

// 玩家获得格挡的统一入口：势不可当（juggernaut）在此触发反伤
function playerGainBlock(n) {
  const c = G.combat; if (!c) return 0;
  const p = c.player;
  const b = gainBlock(p, n);
  p.block += b;
  if (c.juggernaut && b > 0) hitEnemy(c.juggernaut);
  return b;
}

// 玩家失去生命的统一入口：撕裂（rupture）在玩家回合内失血时 +1 力量
function playerLoseHp(n) {
  G.hp = Math.max(0, G.hp - n);
  pushFx({ k: 'hit', who: 'player', text: '-' + n, cls: '' });
  const c = G.combat;
  if (c && c.rupture) { c.player.str += 1; pushFx({ k: 'icon', who: 'player', text: '⚔️ 力量+1' }); }
}

// 消耗一张牌的统一入口：黑暗之拥抽牌、无惧疼痛给格挡
function exhaustCard(inst) {
  const c = G.combat; if (!c) return;
  c.exhaust.push(inst);
  if (c.darkEmbrace) drawCards(1);
  if (c.fnp) playerGainBlock(c.fnp);
}

function applyDebuff(target, key, amt) {
  if (target.artifact > 0) { target.artifact--; return 0; }
  target[key] = (target[key] || 0) + amt;
  return amt;
}

// ---------- 战斗特效事件（规则层只产出事件，UI 播放） ----------
let fxQueue = [];
let busy = false;
let FX_GAP = 170;
let FX_STEP_MS = 650;
function pushFx(ev) { fxQueue.push(ev); }
function flushFx() { fxQueue.forEach((ev, i) => setTimeout(() => applyFx(ev), i * FX_GAP)); fxQueue = []; }
function applyFx(ev) {
  if (ev.k === 'lunge') fxLunge(ev.who);
  else if (ev.k === 'hit') { fxShake(ev.who); fxDmg(ev.who, ev.text, ev.cls); }
  else if (ev.k === 'orb') fxDmg(ev.who, ev.text, 'fx-orb');
  else if (ev.k === 'evoke') fxDmg(ev.who, ev.text, 'fx-evoke');
  else if (ev.k === 'icon') fxDmg(ev.who, ev.text, 'fx-icon');
}
function fxShake(which) { const el = $(which + '-fig'); if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function fxLunge(which) { const el = $(which + '-fig'); if (!el) return; el.classList.remove('lunge'); void el.offsetWidth; el.classList.add('lunge'); }
function fxDmg(which, text, cls) {
  const zone = $(which + '-fx');
  if (!zone) return;
  const s = document.createElement('span');
  s.className = 'dmg-float ' + (cls || '');
  s.textContent = text;
  s.style.left = (38 + Math.random() * 24) + '%';
  zone.appendChild(s);
  setTimeout(() => s.remove(), 1100);
}

function hitEnemy(dmg, immediate) {
  const c = G.combat;
  // 荆棘反伤（玩家携带荆棘时）
  if ((c.player.thorns || 0) > 0) {
    const th = c.player.thorns;
    c.enemy.hp -= th;
    pushFx({ k: 'hit', who: 'enemy', text: '🌵-' + th, cls: 'fx-block' });
  }
  const real = calcDmg(c.player, c.enemy, dmg);
  let remain = real;
  if (c.enemy.block > 0) { const ab = Math.min(c.enemy.block, remain); c.enemy.block -= ab; remain -= ab; }
  if (remain > 0) c.enemy.hp -= remain;
  G.stats.dealt += real;
  const ev = { k: 'hit', who: 'enemy', text: remain > 0 ? '-' + remain : '格挡', cls: remain > 0 ? '' : 'fx-block' };
  if (immediate) { applyFx(ev); updateHud(); } else pushFx(ev);
}

function hitPlayer(dmg, immediate) {
  const c = G.combat;
  const real = calcDmg(c.enemy, c.player, dmg);
  let remain = real;
  if (c.player.block > 0) { const ab = Math.min(c.player.block, remain); c.player.block -= ab; remain -= ab; }
  if (remain > 0) G.hp = Math.max(0, G.hp - remain);
  G.stats.taken += real;
  const ev = { k: 'hit', who: 'player', text: remain > 0 ? '-' + remain : '格挡', cls: remain > 0 ? '' : 'fx-block' };
  if (immediate) { applyFx(ev); updateHud(); } else pushFx(ev);
}

// ---------- 充能球引擎（故障机器人） ----------
// 球排列：orbs[0] = 最左（最新生成），末尾 = 最右（最旧）。
// 新球插入最左，旧球右移；满员时最右球被挤出并自动激发（FIFO）。
function focusVal() { const c = G.combat; return ((c && c.player.focus) || 0) + ((c && c.focusTemp) || 0); }

// 球伤害不吃力量，吃虚弱/易伤
function orbHit(base) {
  const c = G.combat;
  let d = base;
  if (c.player.weak > 0) d *= 0.75;
  if (c.enemy.vuln > 0) d *= 1.5;
  d = Math.max(0, Math.floor(d));
  c.enemy.hp -= d;
  G.stats.dealt += d;
  return d;
}

function channelOrb(type) {
  const c = G.combat;
  if (!c || !c.orbs) return;
  if (type === 'random') type = R('combat').pick(Object.keys(ORBS));
  if (c.orbs.length >= c.orbSlots) evokeOrb(c.orbs.length - 1);
  const o = { type };
  if (type === 'dark') o.value = 6;
  if (type === 'glass') o.value = 4;
  c.orbs.unshift(o);
  if (type === 'lightning') c.lightningChan = (c.lightningChan || 0) + 1;
  pushFx({ k: 'orb', who: 'player', text: ORBS[type].icon + ' ' + ORBS[type].name });
}

function evokeOrb(i) {
  const c = G.combat;
  if (!c || !c.orbs) return;
  const o = c.orbs[i];
  if (!o) return;
  c.orbs.splice(i, 1);
  const f = focusVal();
  pushFx({ k: 'evoke', who: 'player', text: '💥 激发' + ORBS[o.type].name });
  if (o.type === 'lightning') { const d = orbHit(8 + f); pushFx({ k: 'hit', who: 'enemy', text: '⚡-' + d }); }
  else if (o.type === 'frost') { const b = 5 + f; playerGainBlock(b); pushFx({ k: 'icon', who: 'player', text: '❄️ 格挡+' + b }); }
  else if (o.type === 'dark') { const d = orbHit(o.value); pushFx({ k: 'hit', who: 'enemy', text: '🌑-' + d }); }
  else if (o.type === 'glass') { const d = orbHit((o.value + f) * 2); pushFx({ k: 'hit', who: 'enemy', text: '🔮-' + d }); }
  else if (o.type === 'plasma') { c.player.energy += 2; pushFx({ k: 'icon', who: 'player', text: '⭐ 能量+2' }); }
}

// 回合结束被动：闪电/冰霜/黑暗/玻璃在玩家回合结束时结算
function resolveOrbPassives() {
  const c = G.combat;
  if (!c || !c.orbs) return;
  const f = focusVal();
  const remove = [];
  c.orbs.forEach(o => {
    if (o.type === 'lightning') { const d = orbHit(3 + f); pushFx({ k: 'hit', who: 'enemy', text: '⚡-' + d }); }
    else if (o.type === 'frost') { const b = 2 + f; playerGainBlock(b); pushFx({ k: 'icon', who: 'player', text: '❄️ +' + b }); }
    else if (o.type === 'dark') { o.value += 6 + f; pushFx({ k: 'icon', who: 'player', text: '🌑 蓄能 ' + o.value }); }
    else if (o.type === 'glass') { const d = orbHit(o.value + f); pushFx({ k: 'hit', who: 'enemy', text: '🔮-' + d }); o.value--; if (o.value <= 0) remove.push(o); }
  });
  remove.forEach(o => { const i = c.orbs.indexOf(o); if (i >= 0) c.orbs.splice(i, 1); });
}

// ---------- 卡牌描述 ----------
function effVal(inst, e) { return (e.v || 0) + (inst.up && e.up ? e.up : 0); }
function cardDesc(inst) {
  const d = CARDS[inst.id];
  if (d.desc) return typeof d.desc === 'function' ? d.desc(inst) : d.desc;
  const parts = [];
  d.effects.forEach(e => {
    const v = effVal(inst, e);
    if (e.op === 'damage') parts.push('造成 ' + v + ' 点伤害' + (e.times ? '，共 ' + e.times + ' 次' : '') + '。');
    else if (e.op === 'block') parts.push('获得 ' + v + ' 点格挡。');
    else if (e.op === 'heal') parts.push('回复 ' + v + ' 点生命。');
    else if (e.op === 'loseHp') parts.push('失去 ' + v + ' 点生命。');
    else if (e.op === 'energy') parts.push('获得 ' + v + ' 点能量。');
    else if (e.op === 'draw') { if (v > 0) parts.push('抽 ' + v + ' 张牌。'); }
    else if (e.op === 'cleanse') parts.push('解除自身所有负面状态。');
    else if (e.op === 'channel') {
      const nm = e.orb === 'random' ? '个随机充能球' : '个' + ORBS[e.orb].name;
      parts.push('生成 ' + (e.v === 'X' ? 'X' : v) + ' ' + nm + '。');
    }
    else if (e.op === 'evoke') {
      if (e.side === 'all') parts.push('激发自己所有的充能球。');
      else parts.push('激发最' + (e.side === 'left' ? '左' : '右') + '侧的充能球 ' + (e.times === 'X' ? 'X' : (e.times || 1)) + ' 次。');
    }
    else if (e.op === 'focus') parts.push('获得 ' + v + ' 点集中' + (e.temp ? '（本回合）' : '') + '。');
    else if (e.op === 'orbSlots') parts.push('获得 ' + v + ' 个充能球栏位。');
    else if (e.op === 'triggerLightning') parts.push('触发所有闪电球的被动效果。');
    else if (e.op === 'triggerDark') parts.push('触发所有黑暗球的被动效果。');
    else if (e.op === 'uniqueDraw') parts.push('每拥有一种充能球，抽 1 张牌。');
    else if (e.op === 'allForOne') parts.push('把弃牌堆中所有 0 费牌抽回手牌。');
    else if (e.op === 'doubleEnergy') parts.push('能量翻倍。');
    else if (e.op === 'modded') parts.push('此牌费用永久 +1。');
    else if (e.op === 'flag') parts.push(e.text || '');
    else if (e.op === 'status') {
      const st = STATUS[e.key];
      const tgt = e.target === 'self' ? '获得' : '施加';
      parts.push(tgt + ' ' + v + ' 层' + st.name + '。');
    }
  });
  return parts.join('');
}

// ---------- 效果解释器 ----------
function execCard(inst) {
  const c = G.combat, p = c.player, e = c.enemy;
  const def = CARDS[inst.id];
  let didAttack = false;
  def.effects.forEach(ef => {
    const v = effVal(inst, ef);
    switch (ef.op) {
      case 'damage': {
        let dmg = v;
        if (!c.firstAttackDone && hasRelic('sharp_dagger')) { dmg += RELICS.sharp_dagger.firstAttackBonus; c.firstAttackDone = true; pushFx({ k: 'icon', who: 'player', text: '🗡️ +4' }); }
        if (!didAttack) { pushFx({ k: 'lunge', who: 'player' }); didAttack = true; }
        for (let h = 0; h < (ef.times || 1); h++) { if (e.hp <= 0) break; hitEnemy(dmg); }
        break;
      }
      case 'block': playerGainBlock(v); break;
      case 'heal': { const b = G.hp; G.hp = Math.min(G.maxHp, G.hp + v); if (G.hp > b) pushFx({ k: 'hit', who: 'player', text: '+' + (G.hp - b), cls: 'fx-heal' }); break; }
      case 'loseHp': playerLoseHp(v); break;
      case 'energy': p.energy += v; break;
      case 'draw': drawCards(v); break;
      case 'cleanse': DEBUFFS.forEach(k => { p[k] = 0; }); break;
      case 'status':
        if (ef.target === 'self') {
          if (DEBUFFS.includes(ef.key)) applyDebuff(p, ef.key, v); else p[ef.key] = (p[ef.key] || 0) + v;
        } else applyDebuff(e, ef.key, v);
        break;
      case 'channel': {
        let cnt = ef.v === 'X' ? (c._x || 0) : v;
        for (let i = 0; i < cnt; i++) channelOrb(ef.orb);
        break;
      }
      case 'evoke': {
        if (ef.side === 'all') { while (c.orbs && c.orbs.length) evokeOrb(c.orbs.length - 1); }
        else {
          let n = ef.times === 'X' ? (c._x || 0) + (inst.up && ef.xUp ? ef.xUp : 0) : (ef.times || 1);
          for (let i = 0; i < n; i++) { if (!c.orbs || !c.orbs.length) break; evokeOrb(ef.side === 'left' ? 0 : c.orbs.length - 1); }
        }
        break;
      }
      case 'focus':
        if (ef.temp) c.focusTemp = (c.focusTemp || 0) + v;
        else p.focus = (p.focus || 0) + v;
        pushFx({ k: 'icon', who: 'player', text: '🎯 集中+' + v });
        break;
      case 'orbSlots':
        c.orbSlots = Math.min(10, c.orbSlots + v);
        pushFx({ k: 'icon', who: 'player', text: '🧩 球位+' + v });
        break;
      case 'triggerLightning': {
        const f = focusVal();
        c.orbs.forEach(o => { if (o.type === 'lightning') { const d = orbHit(3 + f); pushFx({ k: 'hit', who: 'enemy', text: '⚡-' + d }); } });
        break;
      }
      case 'triggerDark': {
        const f = focusVal();
        c.orbs.forEach(o => { if (o.type === 'dark') { o.value += 6 + f; pushFx({ k: 'icon', who: 'player', text: '🌑 蓄能 ' + o.value }); } });
        break;
      }
      case 'uniqueDraw': drawCards(new Set(c.orbs.map(o => o.type)).size); break;
      case 'allForOne': {
        const back = p.discard.filter(inst2 => cardCost(inst2) === 0);
        p.discard = p.discard.filter(inst2 => cardCost(inst2) !== 0);
        back.forEach(inst2 => p.hand.push(inst2));
        break;
      }
      case 'doubleEnergy': p.energy += p.energy; pushFx({ k: 'icon', who: 'player', text: '⚡ 能量翻倍' }); break;
      case 'voltaic': { const n = c.lightningChan || 0; for (let i = 0; i < n; i++) channelOrb('lightning'); break; }
      case 'flag': c[ef.flag] = ef.v != null ? v : true; break;
      case 'modded': inst.cm = (inst.cm || 0) + 1; break;
      // —— 铁甲战士新 op ——
      case 'selfCopy': p.discard.push({ id: inst.id, up: inst.up, cm: inst.cm || 0, rm: inst.rm || 0 }); pushFx({ k: 'icon', who: 'player', text: '📄 复制' }); break;
      case 'bodySlam': { const base = p.block; if (base > 0) hitEnemy(base); else pushFx({ k: 'icon', who: 'player', text: '没有格挡…' }); break; }
      case 'armaments': { let done = 0; const all = inst.up; for (const h of p.hand) { if (!all && done >= 1) break; if (!h.up && cardUpgradable(h)) { h.up = true; done++; } } pushFx({ k: 'icon', who: 'player', text: done ? '⚒️ 强化×' + done : '⚒️ 无可强化' }); break; }
      case 'headbutt': { if (p.discard.length) { const i = R('combat').int(p.discard.length); const back = p.discard.splice(i, 1)[0]; p.drawPile.push(back); pushFx({ k: 'icon', who: 'player', text: '🔨 ' + CARDS[back.id].name + '置顶' }); } break; }
      case 'exhaustRandom': { for (let k = 0; k < (ef.n || 1); k++) { if (!p.hand.length) break; const pick = p.hand[R('combat').int(p.hand.length)]; p.hand.splice(p.hand.indexOf(pick), 1); setLog('【' + cardName(pick) + '】被随机消耗了。'); exhaustCard(pick); } break; }
      case 'secondWind': { const nonAtk = p.hand.filter(h => CARDS[h.id].type !== 'attack'); if (!nonAtk.length) { pushFx({ k: 'icon', who: 'player', text: '没有非攻击牌' }); break; } nonAtk.forEach(h => { p.hand.splice(p.hand.indexOf(h), 1); exhaustCard(h); playerGainBlock(v); }); pushFx({ k: 'icon', who: 'player', text: '🛡️ ×' + nonAtk.length }); break; }
      case 'fiendFire': { const hand = p.hand.splice(0); hand.forEach(h => exhaustCard(h)); for (let k = 0; k < hand.length; k++) { if (c.enemy.hp > 0) hitEnemy(v); } if (!hand.length) pushFx({ k: 'icon', who: 'player', text: '手牌是空的…' }); break; }
      case 'feed': { hitEnemy(v); if (G.combat && c.enemy.hp <= 0 && G.hp > 0) { const mh = inst.up ? 4 : 3; G.maxHp += mh; G.hp = Math.min(G.maxHp, G.hp + mh); pushFx({ k: 'icon', who: 'player', text: '🍖 最大生命+' + mh }); } break; }
      case 'rampage': { hitEnemy(v + (inst.rm || 0)); inst.rm = (inst.rm || 0) + (inst.up ? 10 : 5); break; }
      case 'pactsEnd': { if (c.exhaust.length >= 3) hitEnemy(v); else pushFx({ k: 'icon', who: 'player', text: '消耗堆不足 3 张' }); break; }
      case 'tempThorns': p.thorns += v; c.tempThorns = (c.tempThorns || 0) + v; break;
    }
  });
}

// 卡牌实际费用（含升级改费与改装的永久加费）
function cardCost(inst) {
  const def = CARDS[inst.id];
  if (def.cost === 'X') return 'X';
  let cost = def.cost;
  if (inst.up && def.upCost != null) cost = def.upCost;
  // 午夜：本场战斗每消耗过一张牌，费用 -1
  if (inst.id === 'midnight' && G.combat) cost = Math.max(1, cost - G.combat.exhaust.length);
  return cost + (inst.cm || 0);
}

function playCard(idx) {
  const c = G.combat, p = c.player;
  if (busy || !c) return;
  const inst = p.hand[idx];
  if (!inst) return;
  const def = CARDS[inst.id];
  if (def.keywords && def.keywords.includes('unplayable')) { setLog('【' + def.name + '】无法被打出！'); render(); return; }
  const isX = def.cost === 'X';
  const cost = isX ? p.energy : cardCost(inst);
  if (isX ? p.energy <= 0 : cost > p.energy) return;

  p.hand.splice(idx, 1);
  if (isX) { c._x = p.energy; p.energy = 0; } else p.energy -= cost;
  setLog('你打出了【' + cardName(inst) + '】' + (isX ? '（X=' + c._x + '）' : ''));
  execCard(inst);
  c._x = 0;

  // 回响形态：每回合第一张牌结算两次
  if (c.echo && !c.echoUsed && c.enemy.hp > 0 && G.hp > 0) {
    c.echoUsed = true;
    setLog('回响形态：【' + cardName(inst) + '】再次生效！');
    execCard(inst);
  }
  // 连环拳：本回合接下来的攻击牌额外打出一次
  if (c.otp > 0 && def.type === 'attack' && c.enemy.hp > 0 && G.hp > 0) {
    c.otp--;
    setLog('连环拳：【' + cardName(inst) + '】额外打出一次！');
    execCard(inst);
  }
  // 雷暴：打出能力牌时生成闪电球
  if (c.storm && def.type === 'power') channelOrb('lightning');

  if (def.keywords && def.keywords.includes('exhaust')) exhaustCard(inst);
  else p.discard.push(inst);

  if (c.enemy.hp <= 0) { fxQueue = []; winCombat(); return; }
  if (G.hp <= 0) { fxQueue = []; gameOver(); return; }
  render();
}

// ---------- 抽牌 / 牌堆 ----------
function drawCards(n) {
  const p = G.combat.player;
  if (G.combat.noDraw) return; // 战斗专注：本回合不能再抽牌
  for (let i = 0; i < n; i++) {
    if (p.drawPile.length === 0) {
      if (p.discard.length === 0) break;
      p.drawPile = shufflePile(p.discard.splice(0));
    }
    p.hand.push(p.drawPile.pop());
  }
}

// ---------- 战斗流程 ----------
function startCombat(enemyKey, tier) {
  const def = ENEMIES[enemyKey];
  const drawPile = shufflePile(G.deck.map(c => ({ id: c.id, up: c.up })));
  const hand = [];
  // 固有：战斗开始时直接进入手牌
  for (let i = drawPile.length - 1; i >= 0; i--) {
    if ((CARDS[drawPile[i].id].keywords || []).includes('innate')) { hand.push(drawPile.splice(i, 1)[0]); }
  }
  // 小怪随层数增强；第二幕整体更凶（精英/BOSS 按幕加成，小怪额外叠加层数偏移）
  const actScale = (G.act || 1) - 1;
  const t = (def.boss || def.elite) ? Math.max(0, tier || 0)
    : Math.max(0, (tier || 0) + actScale * 7);
  let hp, dmgUp;
  if (def.boss || def.elite) {
    hp = Math.round(def.hp * (1 + 0.3 * actScale));
    dmgUp = 2 * actScale;
  } else {
    hp = Math.round(def.hp * (1 + t * 0.07));
    dmgUp = Math.floor(t * 0.6);
  }
  G.combat = {
    enemyKey,
    tier: t,
    turn: 1,
    player: { block: 0, energy: 3, energyMax: 3, str: 0, dex: 0, weak: 0, vuln: 0, frail: 0, poison: 0, thorns: 0, artifact: 0, focus: 0, hand, drawPile, discard: [] },
    enemy: { name: def.name, hp, maxHp: hp, block: 0, str: 0, dex: 0, weak: 0, vuln: 0, frail: 0, poison: 0, thorns: 0, artifact: 0,
             dmgUp,
             def, lastMoveId: '', isBoss: !!def.boss },
    exhaust: [],
    firstAttackDone: false,
    // 充能球（仅故障机器人）
    orbs: G.char === 'defect' ? [] : undefined,
    orbSlots: 3,
    lightningChan: 0,
    focusTemp: 0,
    echoUsed: false,
  };
  setIntent();
  G.stats.fights++;
  // 遗物：战斗开始钩子
  relicHook('onCombatStart');
  drawCards(HAND_SIZE);
  G.screen = 'combat';
  busy = false;
  fxQueue = [];
  setLog((t >= 6 ? '强大的' : '') + def.name + ' 挡在了你面前！');
  render();
}

// 加权随机选择敌人行动（不连续重复上一次）
function pickEnemyMove(e) {
  const ratio = e.hp / e.maxHp;
  let moves = e.def.moves;
  if (e.def.phases) {
    const ph = e.def.phases.find(p => ratio > p.above) || e.def.phases[e.def.phases.length - 1];
    moves = ph.moves;
  }
  const cands = moves.filter(m => m.id !== e.lastMoveId);
  const pool = cands.length ? cands : moves;
  const total = pool.reduce((s, m) => s + m.wt, 0);
  let roll = R('enemy').next() * total;
  for (const m of pool) { roll -= m.wt; if (roll <= 0) return m; }
  return pool[pool.length - 1];
}

function setIntent() {
  const e = G.combat.enemy;
  e.intent = pickEnemyMove(e);
  e.lastMoveId = e.intent.id;
}

function intentText() {
  const e = G.combat.enemy, it = e.intent;
  if (!it) return '';
  if (it.t === 'atk') return '⚔️ ' + calcDmg(e, G.combat.player, it.d) + (it.hits ? '×' + it.hits : '') + (it.ps ? ' ☠️' : '');
  if (it.t === 'def') return '🛡️ 防御 ' + it.d;
  if (it.t === 'buff') return '⭐ 强化';
  if (it.t === 'curse') return '💀 诅咒';
  if (it.t === 'shield') return '🛡️⭐ 护盾强化';
  return '?';
}

function endTurn() {
  if (busy || !G.combat) return;
  busy = true;
  const c = G.combat, p = c.player;
  if (p.weak > 0) p.weak--;
  if (p.vuln > 0) p.vuln--;
  if (p.frail > 0) p.frail--;
  // 弃牌：虚无消耗、保留留下、其余进弃牌堆
  const kept = [];
  p.hand.forEach(inst => {
    const kw = CARDS[inst.id].keywords || [];
    if (kw.includes('ethereal')) { c.exhaust.push(inst); pushFx({ k: 'icon', who: 'player', text: '💨 ' + CARDS[inst.id].name }); }
    else if (kw.includes('retain')) kept.push(inst);
    else p.discard.push(inst);
  });
  p.hand = kept;
  // 充能球被动（闪电/冰霜/黑暗/玻璃）在玩家回合结束时结算
  if (c.orbs) {
    resolveOrbPassives();
    if (c.consuming) evokeOrb(0); // 消耗阴影：回合末激发最左球
    updateHud();
    if (c.enemy.hp <= 0) { busy = false; fxQueue = []; winCombat(); return; }
  }
  setLog('敌人回合……');
  updateHud();
  render();
  setTimeout(runEnemySteps, 420);
}

function runEnemySteps() {
  const c = G.combat, p = c.player, e = c.enemy;
  // 中毒结算（敌人回合开始，无视格挡）
  if (e.poison > 0) {
    e.hp -= e.poison;
    pushFx({ k: 'hit', who: 'enemy', text: '☠️-' + e.poison, cls: '' });
    e.poison--;
    updateHud();
    if (e.hp <= 0) { busy = false; fxQueue = []; winCombat(); return; }
  }
  e.block = 0;
  updateHud();

  const it = e.intent;
  const steps = [];
  if (it.t === 'atk') {
    const hits = it.hits || 1;
    for (let h = 0; h < hits; h++) {
      steps.push(() => {
        hitPlayer(it.d, true);
        fxLunge('enemy');
        setLog(e.name + ' 发动攻击！');
        // 荆棘反伤可能杀死敌人
        if (c.enemy.hp <= 0) { busy = false; fxQueue = []; winCombat(); return 'combat_end'; }
      });
    }
    if (it.wk) steps.push(() => { applyDebuff(p, 'weak', it.wk); applyFx({ k: 'icon', who: 'player', text: '💀 虚弱+' + it.wk }); setLog(e.name + ' 削弱了你！'); updateHud(); });
    if (it.v) steps.push(() => { applyDebuff(p, 'vuln', it.v); applyFx({ k: 'icon', who: 'player', text: '💔 易伤+' + it.v }); updateHud(); });
    if (it.ps) steps.push(() => { applyDebuff(p, 'poison', it.ps); applyFx({ k: 'icon', who: 'player', text: '☠️ 中毒+' + it.ps }); setLog(e.name + ' 的毒液渗入了伤口！'); updateHud(); });
  } else if (it.t === 'def') {
    steps.push(() => { e.block += it.d; applyFx({ k: 'icon', who: 'enemy', text: '🛡️ +' + it.d }); setLog(e.name + ' 进入防御。'); updateHud(); });
  } else if (it.t === 'buff') {
    steps.push(() => { e.str += it.str; applyFx({ k: 'icon', who: 'enemy', text: '⭐ 力量+' + it.str }); setLog(e.name + ' 力量提升了！'); updateHud(); });
  } else if (it.t === 'shield') {
    steps.push(() => { e.block += it.d; e.str += it.str; applyFx({ k: 'icon', who: 'enemy', text: '🛡️⭐ 蓄力！' }); setLog(e.name + ' 展开护盾并蓄力！'); updateHud(); });
  } else if (it.t === 'curse') {
    steps.push(() => {
      applyDebuff(p, 'weak', it.wk); applyDebuff(p, 'vuln', it.v);
      applyFx({ k: 'icon', who: 'player', text: '💀 诅咒！' });
      setLog(e.name + ' 诅咒了你！');
      updateHud();
    });
  }

  let i = 0;
  const runNext = () => {
    if (!G.combat) { busy = false; return; }
    if (i < steps.length) {
      const r = steps[i++]();
      if (r === 'combat_end') return;
      if (G.hp <= 0) { busy = false; gameOver(); return; }
      setTimeout(runNext, FX_STEP_MS);
    } else {
      setTimeout(finishEnemyTurn, 480);
    }
  };
  runNext();
}

function finishEnemyTurn() {
  const c = G.combat, p = c.player, e = c.enemy;
  // 玩家中毒结算（玩家回合开始，无视格挡）
  if (p.poison > 0) {
    G.hp = Math.max(0, G.hp - p.poison);
    pushFx({ k: 'hit', who: 'player', text: '☠️-' + p.poison, cls: '' });
    p.poison--;
    if (G.hp <= 0) { busy = false; gameOver(); return; }
  }
  if (e.weak > 0) e.weak--;
  if (e.vuln > 0) e.vuln--;
  if (e.frail > 0) e.frail--;
  e.moveIdx = (e.moveIdx || 0) + 1;
  setIntent();
  c.turn++;
  G.stats.turns++;
  // 壁垒：格挡保留到下回合；否则回合开始清空
  if (!c.barricade) p.block = 0;
  p.energy = p.energyMax;
  // 铁甲战士回合开始旗帜：恶魔形态 / 薪火之源 / 火焰屏障荆棘过期 / 连环拳与禁抽重置
  if (c.demonForm) { p.str += c.demonForm; pushFx({ k: 'icon', who: 'player', text: '😈 力量+' + c.demonForm }); }
  if (c.pyre) { p.energy += c.pyre; pushFx({ k: 'icon', who: 'player', text: '🔥 能量+' + c.pyre }); }
  if (c.tempThorns) { p.thorns = Math.max(0, p.thorns - c.tempThorns); c.tempThorns = 0; }
  c.otp = 0;
  c.noDraw = false;
  // 充能球：等离子被动（回合开始 +1 能量）与回合开始重置
  if (c.orbs) {
    c.orbs.forEach(o => { if (o.type === 'plasma') p.energy += 1; });
    if (c.biased && p.focus > 0) { p.focus--; pushFx({ k: 'icon', who: 'player', text: '🎯 集中-1' }); }
    c.focusTemp = 0;
    c.echoUsed = false;
    if (c.coolant) {
      const uniq = new Set(c.orbs.map(o => o.type)).size;
      if (uniq) { const b = 2 * uniq; playerGainBlock(b); pushFx({ k: 'icon', who: 'player', text: '❄️ 格挡+' + b }); }
    }
  }
  if (c.buffer) { p.artifact = (p.artifact || 0) + 2; pushFx({ k: 'icon', who: 'player', text: '🛡 人工制品+2' }); }
  drawCards(HAND_SIZE + (hasRelic('snake_eye') ? RELICS.snake_eye.turnDraw : 0));
  relicHook('onTurnStart'); // 遗物：回合开始钩子（如圣树之种）
  busy = false;
  render();
}

// ---------- 奖励 / 金币 / 遗物 / 药水 ----------
function gainGold(n) { const bonus = hasRelic('lucky_coin') ? RELICS.lucky_coin.goldBonus : 0; G.gold += n + bonus; }

function grantRelic() {
  const pool = relicPoolFor();
  if (!pool.length) return null;
  const id = R('reward').pick(pool);
  G.relics.push(id);
  return id;
}
// 随机遗物池：排除专属遗物，且只含当前角色的遗物
function relicPoolFor() {
  return Object.keys(RELICS).filter(id => !G.relics.includes(id) && !RELICS[id].exclusive
    && (!RELICS[id].char || RELICS[id].char === G.char));
}

function grantPotion() {
  if (G.potions.length >= 3) return null;
  const id = R('potion').pick(POTION_KEYS);
  G.potions.push(id);
  return id;
}

function RARE_POOL() { return cardPool('rare'); }
// 当前角色的卡池（未标记 char 的卡牌默认属于骑士池）
function cardPool(rar) {
  return Object.keys(CARDS).filter(id => CARDS[id].rarity === rar
    && (CARDS[id].char || 'knight') === (G.char || 'knight'));
}
function pickCardByRarity(weights) {
  const roll = R('reward').next();
  let rar = 'common';
  if (roll < weights.rare) rar = 'rare';
  else if (roll < weights.rare + weights.uncommon) rar = 'uncommon';
  const pool = cardPool(rar);
  return { id: R('reward').pick(pool), up: false };
}

function winCombat() {
  const node = G.map.nodes[G.pos];
  const def = ENEMIES[G.combat.enemyKey];
  const tier = G.combat.tier || 0;
  relicHook('onCombatEnd'); // 燃烧之血：战斗胜利回血
  G.combat = null;
  if (node.type === 'boss') {
    fxQueue = []; busy = false;
    if (G.act === 1) {
      G.pendingReward = R('reward').shuffle(GOLD_POOL().slice()).slice(0, 3).map(id => ({ id, up: false }));
      G.screen = 'goldchoice';
      setLog(MAPS[actMapKey()].bossName + ' 倒下了！它的宝藏中有一张金卡……');
      render(); return;
    }
    clearSave(); G.screen = 'victory'; render(); return;
  }
  const base = def.gold[0] + R('reward').int(def.gold[1] - def.gold[0] + 1);
  const gain = Math.round(base * (1 + tier * 0.05)); // 越深处赏金越高
  gainGold(gain);
  G.goldGain = gain;
  G.rewardRelic = '';
  if (node.type === 'elite') G.rewardRelic = grantRelic() || '';
  const weights = node.type === 'elite' ? { rare: 0.25, uncommon: 0.4 } : { rare: 0.1, uncommon: 0.3 };
  G.pendingReward = [pickCardByRarity(weights), pickCardByRarity(weights), pickCardByRarity(weights)];
  // 药水掉落
  G.droppedPotion = (R('potion').next() < 0.35) ? grantPotion() : null;
  G.screen = 'reward';
  render();
}

function gameOver() { fxQueue = []; busy = false; G.combat = null; clearSave(); G.screen = 'gameover'; render(); }

// ==================== 10. 地图生成（带约束） ====================
function genMap() {
  const nodes = {}, cols = [];
  let id = 0;
  MAP_COLS.forEach((n, ci) => {
    const col = [];
    for (let i = 0; i < n; i++) {
      const node = {
        id: id++, col: ci, type: 'monster', next: [],
        x: 9 + ci * (82 / (MAP_COLS.length - 1)) + (ci > 0 && ci < MAP_COLS.length - 1 ? (R('map').next() * 6 - 3) : 0),
        y: ((i + 1) / (n + 1)) * 100,
      };
      col.push(node); nodes[node.id] = node;
    }
    cols.push(col);
  });
  for (let ci = 0; ci < cols.length - 1; ci++) {
    const a = cols[ci], b = cols[ci + 1];
    a.forEach((n, i) => {
      let targets;
      if (b.length === 1) targets = [0];
      else {
        const base = Math.min(b.length - 1, Math.floor(i * b.length / a.length));
        targets = [base];
        if (R('map').next() < 0.6) {
          const extra = R('map').next() < 0.5 ? base + 1 : base - 1;
          if (extra >= 0 && extra < b.length && !targets.includes(extra)) targets.push(extra);
        }
      }
      targets.forEach(t => n.next.push(b[t].id));
    });
    b.forEach((m, j) => {
      if (!a.some(n => n.next.includes(m.id))) {
        a[Math.min(a.length - 1, Math.floor(j * a.length / b.length))].next.push(m.id);
      }
    });
  }
  cols[0][0].type = 'settlers'; // 先古遗民节点
  cols[cols.length - 1][0].type = 'boss';
  const mids = [];
  cols.slice(1, -1).forEach(c => c.forEach(n => mids.push(n)));
  const types = R('map').shuffle(MID_TYPES.slice());
  mids.forEach((n, i) => { n.type = types[i]; });
  // 约束：精英不出现在前段
  mids.forEach(n => {
    if (n.type === 'elite' && n.col < ELITE_MIN_COL) {
      const swap = mids.find(m => m.type === 'monster' && m.col >= ELITE_MIN_COL);
      if (swap) { swap.type = 'elite'; n.type = 'monster'; }
    }
  });
  // 约束：篝火不相邻（同一节点的直接后继不能还是篝火）
  mids.forEach(n => {
    if (n.type === 'campfire') {
      n.next.forEach(t => { if (nodes[t].type === 'campfire') { nodes[t].type = 'monster'; } });
    }
  });
  return { cols, nodes };
}

function posNode() { return G.pos >= 0 ? G.map.nodes[G.pos] : null; }
function actMapKey() { return G.actOrder ? G.actOrder[(G.act || 1) - 1] : 'ruin'; }

function advance() { G.screen = 'map'; saveRun(); render(); }

function enterNodeAt(id) {
  const cur = posNode();
  // 开局（pos = -1）只能进入第 0 列的节点
  if (G.pos === -1) { if (G.map.nodes[id].col !== 0) return; }
  else if (!cur.next.includes(id)) return;
  G.pos = id;
  G.path.push(id);
  let node = G.map.nodes[id];
  // 事件：挑战石碑会强制把下一节点变成精英
  if (G.forceNextElite && (node.type === 'monster')) {
    node.type = 'elite';
    G.forceNextElite = false;
  }
  if (node.type === 'monster' || node.type === 'elite' || node.type === 'boss') {
    const map = MAPS[actMapKey()];
    const enemyKey = node.type === 'boss' ? map.boss
      : node.type === 'elite' ? R('enemy').pick(map.elite)
      : pickEnemyForFloor(node.col);
    startCombat(enemyKey, node.col);
  } else if (node.type === 'settlers') {
    G.settler = { act: G.act, phase: 'choose', relic: '', sel: [], transformed: 0, healed: false };
    G.screen = 'settlers';
    setLog('先古遗民在篝火旁向你招手……');
    saveRun(); render();
  } else if (node.type === 'treasure') {
    const gain = 25 + R('reward').int(16);
    gainGold(gain);
    G.goldGain = gain;
    G.rewardRelic = grantRelic() || '';
    G.pendingReward = R('reward').shuffle(RARE_POOL().slice()).slice(0, 3).map(cid => ({ id: cid, up: false }));
    G.droppedPotion = null;
    G.screen = 'reward';
    setLog('宝箱中有 ' + gain + ' 金币和一份遗物！');
    render();
  } else if (node.type === 'campfire') { G.restUsed = false; G.screen = 'rest'; render(); }
  else if (node.type === 'shop') { genShop(); G.screen = 'shop'; render(); }
  else if (node.type === 'event') { G.eventDef = pickEvent(); G.eventResult = ''; G.screen = 'event'; render(); }
}

function pickEnemyForFloor(col) {
  const map = MAPS[actMapKey()];
  const pool = col <= 2 ? map.weak : col <= 7 ? map.monsters : map.strong;
  return pool[R('enemy').int(pool.length)];
}

function pickEvent() {
  const avail = EVENTS.filter(ev => !G.usedEvents.includes(ev.id));
  const ev = avail.length ? R('event').pick(avail) : R('event').pick(EVENTS);
  if (!G.usedEvents.includes(ev.id)) G.usedEvents.push(ev.id);
  return ev;
}

function chooseEventOption(i) {
  if (G.screen !== 'event' || G.eventResult) return;
  const opt = G.eventDef.options[i];
  if (!opt || !opt.cond()) return;
  G.eventResult = opt.run();
  setLog(G.eventDef.title + '：' + G.eventResult);
  render();
}

function eventContinue() { if (G.screen === 'event' && G.eventResult) advance(); }

// ==================== 11. 商店 ====================
function shopPrice(base) { return hasRelic('ledger') ? Math.floor(base * 0.75) : base; }

function genShop() {
  const s = {
    cards: [], relic: null, potions: [],
    healPrice: shopPrice(55), healSold: false,
    removePrice: shopPrice(75), removeSold: false,
  };
  const weights = { rare: 0.15, uncommon: 0.35 };
  for (let i = 0; i < 4; i++) {
    const roll = R('shop').next();
    let rar = 'common';
    if (roll < weights.rare) rar = 'rare';
    else if (roll < weights.rare + weights.uncommon) rar = 'uncommon';
    const pool = cardPool(rar);
    s.cards.push({ inst: { id: R('shop').pick(pool), up: false }, price: shopPrice(46 + R('shop').int(22)), sold: false });
  }
  const relicPool = relicPoolFor();
  if (relicPool.length) s.relic = { id: R('shop').pick(relicPool), price: shopPrice(125 + R('shop').int(40)), sold: false };
  for (let i = 0; i < 2; i++) s.potions.push({ id: R('shop').pick(POTION_KEYS), price: shopPrice(42 + R('shop').int(18)), sold: false });
  G.shopStock = s;
}

function buyCard(i) {
  const item = G.shopStock.cards[i];
  if (!item || item.sold || G.gold < item.price) return;
  G.gold -= item.price; item.sold = true; G.deck.push(item.inst);
  setLog('购得了【' + cardName(item.inst) + '】');
  render();
}
function buyRelic() {
  const it = G.shopStock.relic;
  if (!it || it.sold || G.gold < it.price) return;
  G.gold -= it.price; it.sold = true; G.relics.push(it.id);
  setLog('购得遗物【' + RELICS[it.id].name + '】');
  render();
}
function buyShopPotion(i) {
  const it = G.shopStock.potions[i];
  if (!it || it.sold || G.gold < it.price || G.potions.length >= 3) return;
  G.gold -= it.price; it.sold = true; G.potions.push(it.id);
  render();
}
function buyHeal() {
  const s = G.shopStock;
  if (s.healSold || G.gold < s.healPrice) return;
  G.gold -= s.healPrice; s.healSold = true;
  G.hp = Math.min(G.maxHp, G.hp + 25);
  render();
}
function buyRemove() { showDeck('remove'); }
function leaveShop() { advance(); }

// ==================== 12. 篝火 ====================
function restHeal() {
  const base = Math.floor(G.maxHp * 0.3);
  let heal = hasRelic('cloak') ? Math.floor(base * 1.5) : base;
  if (hasRelic('royal_pillow')) heal += Math.floor(G.maxHp * 0.15); // 皇家枕头
  G.hp = Math.min(G.maxHp, G.hp + heal);
  G.restUsed = true;
  setLog('你在篝火旁休息，回复了 ' + heal + ' 点生命。');
  render();
}

// ==================== 13. 药水使用 ====================
function usePotion(i) {
  if (busy) return;
  const id = G.potions[i];
  if (!id) return;
  const pot = POTIONS[id];
  const inCombat = !!G.combat && G.screen === 'combat';
  if (pot.combatOnly && !inCombat) { setLog(pot.name + ' 只能在战斗中使用。'); if (inCombat) render(); return; }
  G.potions.splice(i, 1);
  if (inCombat) { pot.use(); if (G.combat.enemy.hp <= 0) { fxQueue = []; winCombat(); return; } if (G.hp <= 0) { fxQueue = []; gameOver(); return; } render(); }
  else { pot.use(); setLog('使用了' + pot.name + '。'); render(); }
}

// ==================== 14. 渲染 ====================
function setLog(t) { if (G) { G.logs.push(t); if (G.logs.length > 4) G.logs.shift(); } }

function cardName(inst) { return CARDS[inst.id].name + (inst.up ? '+' : ''); }
function cardEl(inst, onClick, extraClass) {
  const d = CARDS[inst.id];
  const el = document.createElement('div');
  const unplayable = (d.keywords || []).includes('unplayable');
  el.className = 'card type-' + d.type + (d.rarity === 'gold' ? ' gold-card' : '') + (extraClass ? ' ' + extraClass : '');
  const typeLabel = { attack: '攻击', skill: '技能', power: '能力', curse: '诅咒', status: '状态' }[d.type];
  const kwHtml = (d.keywords || []).length ? '<div class="card-kw">' + d.keywords.map(k => KEYWORD_TIP[k] ? '<span class="kw" data-tip="' + KEYWORD_TIP[k] + '">' + k + '</span>' : '').join('') + '</div>' : '';
  const cc = cardCost(inst);
  const costHtml = cc === 'X' ? 'X' : (cc < 0 ? '—' : cc);
  el.innerHTML =
    '<div class="card-cost">' + costHtml + '</div>' +
    '<div class="card-name">' + cardName(inst) + '</div>' +
    '<div class="card-type">' + typeLabel + (inst.up ? ' · 强化' : '') + '</div>' +
    '<div class="card-desc">' + cardDesc(inst) + '</div>' + kwHtml;
  if (onClick) el.onclick = onClick;
  return el;
}

function hpBar(cur, max, id) {
  const pct = Math.max(0, Math.min(100, cur / max * 100));
  return '<div class="hpbar"><div class="hpfill" id="' + id + '-fill" style="width:' + pct + '%"></div><span id="' + id + '-txt">' + cur + ' / ' + max + '</span></div>';
}

function buffChips(s) {
  let html = '';
  Object.keys(STATUS).forEach(k => {
    const v = s[k] || 0;
    if (!v) return;
    const st = STATUS[k];
    html += '<span class="buff ' + st.cls + '" data-tip="' + st.name + '：' + st.tip(v) + '">' + st.icon + ' ' + st.name + ' ' + v + '</span>';
  });
  return html;
}

function relicBarHtml() {
  if (!G.relics.length) return '';
  return '<span class="relic-bar">' + G.relics.map(rid => {
    const r = RELICS[rid];
    return '<span class="relic" data-tip="' + r.name + '：' + r.desc + '">' + r.icon + '</span>';
  }).join('') + '</span>';
}

function potionBarHtml(clickable) {
  if (!G.potions.length) return '';
  return '<span class="potion-bar">' + G.potions.map((pid, i) => {
    const p = POTIONS[pid];
    const act = clickable ? ' onclick="usePotion(' + i + ')" style="cursor:pointer"' : '';
    return '<span class="relic" data-tip="' + p.name + '：' + p.desc + (clickable ? '（点击使用）' : '') + '"' + act + '>' + p.icon + '</span>';
  }).join('') + '</span>';
}

function topBar() {
  const floor = (G.map && G.pos >= 0) ? G.map.nodes[G.pos].col + 1 : 1;
  const actName = G.actOrder ? MAPS[actMapKey()].name : '';
  return '<div class="topbar">' +
    '<div class="tb-hp">❤️ ' + G.hp + ' / ' + G.maxHp + '</div>' +
    '<div class="tb-gold">🪙 ' + G.gold + '</div>' +
    potionBarHtml(false) +
    relicBarHtml() +
    '<div class="tb-floor">第 ' + G.act + ' 幕 · ' + actName + ' · 第 ' + floor + ' 层 · 种子 ' + (G.seed || '随机') + '</div>' +
    '<button class="btn btn-small" onclick="showDeck(\'view\')">牌组 ' + G.deck.length + '</button>' +
    '</div>';
}

function render() {
  const root = $('app');
  root.innerHTML = '';
  if (!G || G.screen === 'title') return renderTitle(root);
  if (G.screen === 'map') return renderMap(root);
  if (G.screen === 'combat') return renderCombat(root);
  if (G.screen === 'reward') return renderReward(root);
  if (G.screen === 'rest') return renderRest(root);
  if (G.screen === 'shop') return renderShop(root);
  if (G.screen === 'event') return renderEvent(root);
  if (G.screen === 'settlers') return renderSettlers(root);
  if (G.screen === 'goldchoice') return renderGoldChoice(root);
  if (G.screen === 'actclear') return renderActClear(root);
  if (G.screen === 'gameover') return renderEnd(root, false);
  if (G.screen === 'victory') return renderEnd(root, true);
}

function renderTitle(root) {

  root.innerHTML =

    '<h1 class="game-title">尖塔 · 迷你版</h1>' +

    '<div class="helpbox">' +
    '<p>🗼 <b>双幕爬塔</b>：两张地图随机先后出现，各 14 列 33 节点。击败第一幕 BOSS 后<b>三选一金卡</b>，进入更凶险的第二幕。</p>' +
    '<p>🤖 <b>故障机器人</b>：操控<b>充能球</b>——闪电/冰霜/黑暗/玻璃/等离子，堆叠<b>集中</b>放大效果，球位满时最右球自动激发。</p>' +
    '<p>⚡ 每回合 3 点能量，<b>拖动卡牌到画面上方</b>打出，每回合抽 6 张，结束回合手牌进弃牌堆。</p>' +
    '<p>🏺 收集<b>遗物</b>获得被动增益，携带最多 3 瓶<b>药水</b>关键时刻翻盘。</p>' +

    '</div>' +
    '<div class="seed-row">种子：<input id="seed-input" class="seed-input" placeholder="留空则随机"></div>' +
    '<div class="char-row">' +
    Object.keys(CHARACTERS).map(id => {
      const ch = CHARACTERS[id];
      const svg = id === 'knight' ? playerSVG() : defectSVG();
      const relic = ch.starterRelic ? '初始遗物：' + RELICS[ch.starterRelic].icon + ' ' + RELICS[ch.starterRelic].name : '初始遗物：无';
      return '<div class="char-card ' + id + '" onclick="startRun(\'' + id + '\')">' +

function startRun(charId) {
  const input = $('seed-input');
  const seed = (input && input.value.trim()) || String(Date.now());
  G = newState(seed, charId);
  initRng(seed);
  // 随机决定两张地图的先后：第一幕用一张，第二幕用另一张
  G.actOrder = R('map').next() < 0.5 ? ['ruin', 'crypt'] : ['crypt', 'ruin'];
  G.map = genMap();
  G.pos = -1; // 未进入任何节点，从第 0 列开始选择
  G.path = [];
  saveRun();
  G.screen = 'map';
  render();
}

function backToTitle() { G = null; fxQueue = []; busy = false; render(); }

// ---------- 金卡选择（第一幕 BOSS 后） ----------
function chooseGold(i) {
  if (G.screen !== 'goldchoice' || !G.pendingReward) return;
  const inst = G.pendingReward[i];
  G.deck.push(inst);
  setLog('获得了金卡【' + cardName(inst) + '】！');
  G.pendingReward = null;
  saveRun();
  G.screen = 'actclear';
  render();
}
function skipGold() {
  if (G.screen !== 'goldchoice') return;
  G.pendingReward = null;
  saveRun();
  G.screen = 'actclear';
  render();
}

// ---------- 进入第二幕 ----------
function startAct2() {
  G.act = 2;
  G.map = genMap();
  G.pos = -1;
  G.path = [];
  G.screen = 'map';
  setLog('你踏入了' + MAPS[actMapKey()].name + '，塔顶的威压扑面而来……');
  saveRun();
  render();
}

function continueRun() {
  if (loadRun()) render();
  else render();
}

// ---------- 地图 ----------
function renderMap(root) {
  const cur = posNode();
  let lines = '', dots = '';
  Object.values(G.map.nodes).forEach(n => {
    n.next.forEach(t => {
      const m = G.map.nodes[t];
      lines += '<line x1="' + n.x + '" y1="' + n.y + '" x2="' + m.x + '" y2="' + m.y + '"/>';
    });
  });
  Object.values(G.map.nodes).forEach(n => {
    let cls = 'map-node';
    const visited = G.path.includes(n.id);
    if (visited && n.id !== G.pos) cls += ' done';
    if (n.id === G.pos) cls += ' current';
    // 开局（pos = -1）时第 0 列可点；否则当前节点的后继可点
    const reachable = G.pos === -1 ? n.col === 0 : cur.next.includes(n.id);
    if (reachable) cls += ' reachable';
    if (n.type === 'boss') cls += ' boss-node';
    dots += '<div class="' + cls + '" style="left:' + n.x + '%;top:' + n.y + '%"' +
      (reachable ? ' onclick="enterNodeAt(' + n.id + ')"' : '') +
      ' title="' + NODE_LABEL[n.type] + '：' + NODE_TIP[n.type] + '">' + NODE_ICON[n.type] + '</div>';
  });
  root.innerHTML = topBar() +
    '<div class="map-page">' +
    '<div class="map-wrap">' +
    '<svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none">' + lines + '</svg>' +
    dots +
    '<div class="map-legend"><b>图例</b>' +
    Object.keys(NODE_ICON).map(k => '<div>' + NODE_ICON[k] + ' ' + NODE_LABEL[k] + '</div>').join('') +
    '</div>' +
    '</div>' +
    '<p class="map-hint">点击发光的节点前进 · 第 ' + (cur ? cur.col + 1 : 1) + ' / ' + MAP_COLS.length + ' 层 · 已走 ' + G.path.length + ' 个节点</p>' +
    '</div>';
}

const NODE_LABEL = { settlers: '先古遗民', monster: '战斗', elite: '精英', treasure: '宝箱', campfire: '篝火', shop: '商店', boss: 'BOSS', event: '事件' };

  monster: '普通战斗：胜利后获得金币与卡牌奖励',

// ---------- 充能球 UI ----------
function orbTip(o) {
  const f = focusVal();
  if (o.type === 'lightning') return '闪电球：回合结束对随机敌人造成 ' + (3 + f) + ' 伤害；激发时造成 ' + (8 + f) + ' 伤害';
  if (o.type === 'frost') return '冰霜球：回合结束获得 ' + (2 + f) + ' 格挡；激发时获得 ' + (5 + f) + ' 格挡';
  if (o.type === 'dark') return '黑暗球：每回合蓄能 +6，激发时对血量最低的敌人造成 ' + o.value + ' 伤害';
  if (o.type === 'glass') return '玻璃球：回合结束对全体造成 ' + (o.value + f) + ' 伤害然后 -1；激发时造成两倍伤害';
  return '等离子球：回合开始 +1 能量；激发时 +2 能量';
}
function orbBarHtml(c) {
  let html = '';
  for (let i = 0; i < c.orbSlots; i++) {
    const o = c.orbs[i];
    if (o) {
      const d = ORBS[o.type];
      const val = (o.type === 'dark' || o.type === 'glass') ? o.value : '';
      html += '<div class="orb ' + d.cls + '" data-tip="' + orbTip(o) + '">' + d.icon + (val !== '' ? '<i>' + val + '</i>' : '') + '</div>';
    } else html += '<div class="orb orb-empty" data-tip="空球位"></div>';
  }
  return html;
}
function orbInfoChips() {
  const c = G.combat;
  if (!c.orbs) return '';
  let html = '<span class="buff b-focus" data-tip="集中：充能球的被动与激发效果每点 +1（不吃力量加成）">🎯 集中 ' + focusVal() + '</span>';
  html += '<span class="buff b-orbslot" data-tip="球位：充能球上限。球位满时再生成新球，最右侧的球会被挤出并自动激发">🧩 球位 ' + c.orbSlots + '</span>';
  return html;
}

// ---------- 战斗 ----------
function renderCombat(root) {
  const c = G.combat, p = c.player, e = c.enemy;
  root.innerHTML = topBar() +
    '<div class="battlefield">' +
    '<div class="fighter-zone left" id="player-fx">' +
    (c.orbs ? '<div class="orb-bar" id="orb-bar">' + orbBarHtml(c) + '</div>' : '') +
    '<div class="fighter" id="player-fig">' + (G.char === 'defect' ? defectSVG() : playerSVG()) + '</div>' +
    '<div class="fighter-info">' +
    '<div class="fi-row">' + hpBar(G.hp, G.maxHp, 'php') +
    '<span class="shield-zone" id="p-shield">' + (p.block > 0 ? '<span class="shield-badge" data-tip="格挡：抵消等量伤害，你的回合开始时清空">🛡️ ' + p.block + '</span>' : '') + '</span></div>' +
    '<div class="buff-row" id="p-buffs">' + buffChips(p) + orbInfoChips() + '</div>' +
    '</div></div>' +
    '<div class="fighter-zone right" id="enemy-fx">' +
    '<div class="enemy-intent" id="intent-bubble">' + intentText() + '</div>' +
    '<div class="fighter ' + (e.isBoss ? 'boss-fig' : '') + '" id="enemy-fig">' + ENEMY_SVG[c.enemyKey]() + '</div>' +
    '<div class="fighter-info">' +
    '<div class="enemy-nm">' + e.name + (c.tier > 0 ? ' <span class="tier-tag" data-tip="越接近塔顶的小怪越强：生命与伤害提升">强化 +' + c.tier + '</span>' : '') + '</div>' +
    '<div class="fi-row">' + hpBar(Math.max(0, e.hp), e.maxHp, 'ehp') +
    '<span class="shield-zone" id="e-shield">' + (e.block > 0 ? '<span class="shield-badge" data-tip="格挡：抵消等量伤害">🛡️ ' + e.block + '</span>' : '') + '</span></div>' +
    '<div class="buff-row" id="e-buffs">' + buffChips(e) + '</div>' +
    '</div></div>' +
    '<div class="log-panel" id="log-line">' + G.logs.map(l => '<div>' + l + '</div>').join('') + '</div>' +
    '</div>' +
    '<div class="hand" id="hand-area"></div>' +
    '<div class="energy-orb"><span>' + p.energy + '</span>/' + p.energyMax + '</div>' +
    '<div class="potion-panel">' + G.potions.map((pid, i) => {
      const pot = POTIONS[pid];
      return '<button class="potion-btn" data-tip="' + pot.name + '：' + pot.desc + '（点击使用）" onclick="usePotion(' + i + ')">' + pot.icon + '</button>';
    }).join('') + '</div>' +
    '<button class="btn endturn" onclick="endTurn()">结束回合<br><small>第 ' + c.turn + ' 回合</small></button>' +
    '<div class="piles-info">抽 ' + p.drawPile.length + ' · 弃 ' + p.discard.length + ' · 耗 ' + c.exhaust.length + '</div>';

  const handArea = $('hand-area');
  const n = p.hand.length;
  p.hand.forEach((inst, i) => {
    const mid = (n - 1) / 2;
    const slot = document.createElement('div');
    slot.className = 'hand-slot';
    slot.style.setProperty('--r', ((i - mid) * 4.5) + 'deg');
    slot.style.setProperty('--y', (Math.abs(i - mid) * 8) + 'px');
    const def = CARDS[inst.id];
    const unplayable = (def.keywords || []).includes('unplayable');
    const isX = def.cost === 'X';
    const playable = !unplayable && (isX ? p.energy > 0 : cardCost(inst) <= p.energy);
    slot.appendChild(cardEl(inst, null, playable ? 'playable' : 'disabled'));
    const cardElm = slot.firstChild;
    if (playable) attachDrag(cardElm, i);
    handArea.appendChild(slot);
  });

  flushFx();
}

function updateHud() {
  const c = G.combat;
  if (!c) return;
  const p = c.player, e = c.enemy;
  const pf = $('php-fill'), pt = $('php-txt'), ef = $('ehp-fill'), et = $('ehp-txt');
  if (!pf) return;
  pf.style.width = Math.max(0, G.hp / G.maxHp * 100) + '%';
  pt.textContent = Math.max(0, G.hp) + ' / ' + G.maxHp;
  ef.style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
  et.textContent = Math.max(0, e.hp) + ' / ' + e.maxHp;
  $('p-shield').innerHTML = p.block > 0 ? '<span class="shield-badge" data-tip="格挡：抵消等量伤害，你的回合开始时清空">🛡️ ' + p.block + '</span>' : '';
  $('e-shield').innerHTML = e.block > 0 ? '<span class="shield-badge" data-tip="格挡：抵消等量伤害">🛡️ ' + e.block + '</span>' : '';
  $('p-buffs').innerHTML = buffChips(p) + (c.orbs ? orbInfoChips() : '');
  $('e-buffs').innerHTML = buffChips(e);
  const ob = $('orb-bar');
  if (ob && c.orbs) ob.innerHTML = orbBarHtml(c);
  const ll = $('log-line');
  if (ll) ll.innerHTML = G.logs.map(l => '<div>' + l + '</div>').join('');
}

  root.innerHTML = topBar() +

    '<p class="gold-gain">获得 🪙 ' + G.goldGain + ' 金币' +
    (G.rewardRelic ? ' · 遗物【' + RELICS[G.rewardRelic].name + '】' : '') +
    (G.droppedPotion ? ' · ' + POTIONS[G.droppedPotion].name : '') +
    '</p>' +
    '<p>选择一张卡牌加入牌组</p>' +
    '<div class="reward-row" id="reward-row"></div>' +
